<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Node-Monitor</title>
    <!-- 内联 SVG Favicon，修复 /favicon.ico 404 报错 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01'/></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen">

    <!-- Auth Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-[#0b0f19]/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-[#111827] border border-[#1f2937] rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl space-y-6">
            <div class="flex items-center gap-3.5">
                <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-white">Access Restricted</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Enter password to view Node-Monitor</p>
                </div>
            </div>
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                    <input type="password" id="passwordInput" required placeholder="Enter dashboard password" 
                        class="w-full bg-[#0b0f19] border border-[#1f2937] rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono">
                </div>
                <div id="loginError" class="text-xs text-rose-400 hidden">Invalid password. Please try again.</div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold text-sm transition-colors shadow-lg shadow-emerald-500/20">
                    Authenticate
                </button>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-4 md:p-6">
        <header class="flex justify-between items-center pb-6 mb-8 border-b border-[#1f2937]">
            <div class="flex items-center gap-3.5">
                <div class="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 shadow-lg shadow-emerald-500/5">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                        Node-Monitor
                    </h1>
                    <p class="text-xs md:text-sm text-slate-400 mt-0.5">Real-time status & resource utilization</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-slate-200 border border-[#1f2937] px-3 py-1.5 rounded-lg transition-colors">
                    Logout
                </button>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                    Live
                </span>
            </div>
        </header>

        <!-- items-start 阻止同排卡片高度被强制拉伸 -->
        <div id="nodesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start"></div>
    </div>

    <!-- 独立业务逻辑 JS -->
    <script src="/js/app.js"></script>
</body>
</html>
